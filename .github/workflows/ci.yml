name: CI

on:
  push:
    branches: [main, 'fase-*', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: test-rust (fmt, clippy, cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace

  bench:
    name: bench (perf gates + criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Hard gates (release timing tests, marked #[ignore] in debug runs).
      - run: cargo test --release --workspace -- --ignored --nocapture
      # Informative numbers for the phase report; never fails the build on
      # timing, but does fail if a bench does not build/run (pipefail).
      # Only criterion targets: libtest harnesses reject criterion flags.
      - run: |
          set -o pipefail
          cargo bench -p fm-entities --bench weekly_update -- --quick 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt

  test-wasm:
    name: test-wasm (wasm-pack headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The runner image ships Chrome with a matching chromedriver in
      # $CHROMEWEBDRIVER; put it first on PATH so wasm-pack picks it up.
      - name: wasm-pack test
        run: |
          export PATH="$CHROMEWEBDRIVER:$PATH"
          wasm-pack test --headless --chrome crates/fm-wasm

  test-e2e:
    name: test-e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # DIAGNÓSTICO TEMPORÁRIO (fase-3, experimento a): driver Mesa por software com EGL.
      - name: Install Mesa software GL (firefox)
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl-mesa0 libgl1-mesa-dri libegl1 mesa-utils
          eglinfo -B 2>&1 | head -40 || true
      # DIAGNÓSTICO TEMPORÁRIO (fase-3): roda firefox-forced e não para no 1º erro.
      - run: npx playwright test --project=${{ matrix.browser }} ${{ matrix.browser == 'firefox' && '--project=firefox-forced' || '' }}
      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.browser }}
          path: evidence/
          if-no-files-found: warn
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
