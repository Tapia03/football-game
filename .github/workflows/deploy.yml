name: Deploy (Cloudflare Pages)

# Prepared in Phase 0. Every job checks that the Cloudflare secrets exist and
# turns into a no-op until they are configured in the repository settings.

on:
  push:
    # SPIKE: `spike-render` deploys as a Pages preview (never production).
    branches: [main, spike-render]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'deploy-production' || 'deploy-preview' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'football-game' }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured; skipping deploy."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.secrets.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.secrets.outputs.ready == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci && npm run build
      - if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
