[package]
name = "fm-entities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fm-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Test-only: provides the allocation-counting allocator (unsafe lives there).
fm-render.workspace = true

# criterion is native-only: it never builds for wasm32, where benches are not run.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "weekly_update"
harness = false
