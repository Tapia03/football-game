# Spec v2: every transcendental function must go through libm so native and
# WASM builds are bit-identical. This turns `f32::sin` & co. into clippy errors.
disallowed-methods = [
    { path = "f32::sin", reason = "transcendental/std libm differs native vs WASM: use fm_core::math (libm)" },
    { path = "f32::cos", reason = "transcendental/std libm differs native vs WASM: use fm_core::math (libm)" },
    { path = "f32::tan", reason = "transcendental/std libm differs native vs WASM: use fm_core::math (libm)" },
