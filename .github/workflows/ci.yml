name: CI

on:
  push:
    branches: [main, 'fase-*', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: test-rust (fmt, clippy, cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0 # keep in sync with rust-toolchain.toml
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Diagnostics-only tools (feature `diagnostics`) are linted too.
      - run: cargo clippy -p fm-match --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      # The xG the engine worker reads back from outside the tick must be
      # the resolver's, bit for bit (needs the engine-side sum: diagnostics).
      - run: cargo test --release -p fm-match --features diagnostics --lib struck_shot_xg

  stable-canary:
    name: stable-canary (latest stable, informative)
    runs-on: ubuntu-latest
    # Early warning for new lints/regressions in the next toolchain; never blocks.
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bench:
    name: bench (perf gates + criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # Hard gates (release timing tests, marked #[ignore] in debug runs),
      # except the tick_logic wall-clock gate, which runs on its own below.
      - run: cargo test --release --workspace -- --ignored --nocapture --skip full_match_abstract_under_50ms
      # tick_logic wall-clock gate (50 ms): coarse alarm only. Shared runners
      # vary ~27% for identical code (SPEC Fase 5), so it never blocks.
      - name: tick_logic wall-clock alarm (non-blocking)
        continue-on-error: true
        run: cargo test --release -p fm-match --test perf -- --ignored --nocapture
      # Fine checkpoint (blocking): callgrind instruction count of a full
      # match vs the committed baseline (+1.5% max). Deterministic.
      - name: tick_logic instruction count (callgrind)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
          cargo bench -p fm-match --bench instructions
      # The callgrind output of that run, kept as an artifact even when the
      # gate passes or fails: per-function instruction counts, to tell "more
      # game being played" from "more expensive code" when the count moves.
      - name: callgrind profile
        if: always()
        run: |
          out="${TMPDIR:-/tmp}/fm-instructions"
          mkdir -p callgrind
          cp "$out"/callgrind.*.out callgrind/ || true
          callgrind_annotate callgrind/callgrind.match.out > callgrind/match.txt || true
          callgrind_annotate callgrind/callgrind.setup.out > callgrind/setup.txt || true
          head -60 callgrind/match.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: callgrind
          path: callgrind/
      # Informative numbers for the phase report; never fails the build on
      # timing, but does fail if a bench does not build/run (pipefail).
      # Only criterion targets: libtest harnesses reject criterion flags.
      - run: |
          set -o pipefail
          cargo bench -p fm-entities --bench weekly_update -- --quick 2>&1 | tee bench.txt
          cargo bench -p fm-match --bench tick_logic 2>&1 | tee -a bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt

  test-wasm:
    name: test-wasm (wasm-pack headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0 # keep in sync with rust-toolchain.toml
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The runner image ships Chrome with a matching chromedriver in
      # $CHROMEWEBDRIVER; put it first on PATH so wasm-pack picks it up.
      - name: wasm-pack test
        run: |
          export PATH="$CHROMEWEBDRIVER:$PATH"
          wasm-pack test --headless --chrome crates/fm-wasm
          # The game ships the optimised build: prove parity there too.
          wasm-pack test --release --headless --chrome crates/fm-wasm

  test-e2e:
    name: test-e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0 # keep in sync with rust-toolchain.toml
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      # The world's round, timed alone — one Playwright worker, nothing else
      # running — because it is the number that decides whether the matches
      # of a day need a pool of workers (docs/SPEC.md, 7B.4). The whole
      # season only when the workflow is dispatched by hand.
      # WebKit repeats it twenty times: a match worker once went silent
      # there, and a rate takes more than one run (docs/SPEC.md, 7B.4c).
      # It runs even when a test of the suite above failed: what the
      # repetitions say is wanted all the more then.
      - name: World timing (a round of matches, alone)
        if: success() || failure()
        run: npx playwright test tests/e2e/world-timing.spec.ts --project=${{ matrix.browser }} --workers=1 --repeat-each=${{ matrix.browser == 'webkit' && 20 || 1 }}
        env:
          FM_WORLD_TIMING: '1'
          FM_WORLD_SEASON: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.browser }}
          path: evidence/
          if-no-files-found: warn
      # Pixel goldens (Chromium only) are produced by this runner: when a
      # reference is missing Playwright writes the image it got here, to be
      # downloaded and committed (docs/STATE.md, "Golden de pixel").
      - name: Upload pixel goldens as rendered here
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.browser }}
          path: tests/golden/${{ matrix.browser }}/
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
